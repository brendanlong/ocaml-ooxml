name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: OCaml ${{ matrix.ocaml-compiler }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        ocaml-compiler:
          - 5.2.x
          - 5.3.x

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config zlib1g-dev

      - name: Pin packages & install dependencies
        run: |
          opam pin add -y -n --kind path open_packaging .
          opam pin add -y -n --kind path spreadsheetml .
          opam pin add -y -n --kind path easy_xlsx .
          opam install --deps-only -y -t easy_xlsx open_packaging spreadsheetml

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune runtest
